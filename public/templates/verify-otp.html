<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Verify OTP - AxeDz</title>
</head>
<body style="margin:0;padding:0;background:#f4f4f7;color:#333;font-family:Arial,Helvetica,sans-serif;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f4f7;width:100%;min-height:100vh;padding:24px;">
        <tr>
            <td align="center">
                <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:620px;background:#ffffff;border-radius:18px;box-shadow:0 20px 48px rgba(0,0,0,0.08);overflow:hidden;">
                    <tr>
                        <td style="padding:32px;text-align:center;">
                            <h1 style="margin:0 0 16px;font-size:28px;color:#0d6efd;">Verify Your Account</h1>
                        </td>
                    </tr>
                    <tr>
                        <td style="padding:0 32px 32px;">
                            <p style="margin:0 0 16px;font-size:16px;line-height:1.7;">Hello,</p>
                            <p style="margin:0 0 24px;font-size:16px;line-height:1.7;">Use the One-Time Password (OTP) below to verify your account:</p>
                            <div style="font-size:24px;font-weight:700;color:#1f2937;background:#eef2ff;padding:18px;text-align:center;border-radius:10px;margin:0 0 24px;letter-spacing:3px;">{{OTP}}</div>
                            <p style="margin:0 0 24px;font-size:16px;line-height:1.7;">Please enter this code on the AxeDz verification screen. It will expire shortly for security reasons.</p>
                            <div style="text-align:center;">
                                <a href="{{FRONT_SIDE_URL}}" target="_blank" style="display:inline-block;padding:12px 24px;background:#0d6efd;color:#ffffff;text-decoration:none;border-radius:999px;font-weight:700;">Open AxeDz</a>
                            </div>
                            <div style="margin:32px 0 0;color:#666;font-size:14px;line-height:1.6;">
                                <p style="margin:0 0 8px;">If you didn't request this, please ignore this email.</p>
                                <p style="margin:0;">Thank you for using AxeDz!</p>
                            </div>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
